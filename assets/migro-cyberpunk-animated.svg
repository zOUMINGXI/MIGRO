    <path class="data-packet packet-d" pathLength="100" d="M990 278H1027L1054 251H1120" stroke="#F65A9B"/>
  </g>
  <g fill="none" stroke="#F65A9B" stroke-width="2"><path class="signal-arrow" d="M1110 178L1120 188L1110 198"/><path class="signal-arrow signal-b" d="M1130 178L1140 188L1130 198"/></g>
  <path class="frame-charge" d="M190 126V111H209M339 111H358V126M190 239V254H209M339 254H358V239" fill="none" stroke="#F3C54E" stroke-opacity=".48"/>
  <g class="icon-charge" transform="translate(160 85) scale(1.13)">
