<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">MIGRO — Change the Model. Keep the Mind.</title>
  <desc id="hero-desc">The original gold MIGRO icon sits beside the MIGRO wordmark on a dark technical panel with animated cyan data packets, a slow light sweep and breathing neon accents.</desc>
  <style>
    .ambient-sweep { animation: ambient-sweep 7.2s linear infinite; }
    .icon-charge { filter: url(#gold-charge); animation: icon-charge 3.6s ease-in-out infinite; }
    .frame-charge { animation: frame-charge 3.6s ease-in-out infinite; }
    .wordmark-cyan { animation: cyan-breathe 4.8s ease-in-out infinite; }
    .wordmark-magenta { animation: magenta-breathe 6.4s ease-in-out infinite; }
    .data-packet { stroke-dasharray: 7 93; stroke-dashoffset: 100; animation: packet-flow 3.2s linear infinite; }
    .packet-b { animation-delay: -1.6s; animation-duration: 4.4s; }
    .packet-c { animation-delay: -.8s; animation-duration: 3.8s; }
    .packet-d { animation-delay: -2.4s; animation-duration: 4.8s; }
    .signal-arrow { animation: arrow-signal 2.4s ease-in-out infinite; }
    .signal-b { animation-delay: -.35s; }
    .terminal-cursor { animation: cursor-blink 1.6s steps(2, jump-none) infinite; }
    .divider-packet { animation: divider-flow 6.4s linear infinite; }
    @keyframes ambient-sweep { from { transform: translateX(-240px); } to { transform: translateX(1440px); } }
    @keyframes icon-charge { 0%, 100% { opacity: .88; } 50% { opacity: 1; } }
    @keyframes frame-charge { 0%, 100% { stroke-opacity: .26; } 50% { stroke-opacity: .9; } }
    @keyframes cyan-breathe { 0%, 100% { opacity: .14; } 50% { opacity: .48; } }
    @keyframes magenta-breathe { 0%, 100% { opacity: .1; } 50% { opacity: .3; } }
    @keyframes packet-flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes arrow-signal { 0%, 100% { opacity: .2; transform: translateX(0); } 50% { opacity: 1; transform: translateX(5px); } }
    @keyframes cursor-blink { from { opacity: .15; } to { opacity: .9; } }
    @keyframes divider-flow { from { transform: translateX(-160px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) {
      .ambient-sweep, .data-packet, .divider-packet, .terminal-cursor { display: none; }
      .icon-charge, .frame-charge, .wordmark-cyan, .wordmark-magenta, .signal-arrow { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="panel-clip"><rect x="1" y="1" width="1198" height="358" rx="11"/></clipPath>
    <clipPath id="divider-clip"><rect x="48" y="307" width="1104" height="6"/></clipPath>
    <linearGradient id="sweep-light"><stop stop-color="#59E8ED" stop-opacity="0"/><stop offset=".5" stop-color="#59E8ED" stop-opacity=".13"/><stop offset="1" stop-color="#59E8ED" stop-opacity="0"/></linearGradient>
    <linearGradient id="divider-light"><stop stop-color="#59E8ED" stop-opacity="0"/><stop offset=".7" stop-color="#A8FFFF"/><stop offset="1" stop-color="#59E8ED" stop-opacity="0"/></linearGradient>
    <filter id="gold-charge" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="halo"/><feComponentTransfer in="halo" result="soft-halo"><feFuncA type="linear" slope=".24"/></feComponentTransfer><feMerge><feMergeNode in="soft-halo"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#86A5BF" stroke-opacity=".075" stroke-width="1"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1H4" stroke="#D8F5FF" stroke-opacity=".025"/></pattern>
    <radialGradient id="atmosphere" cx=".78" cy=".48" r=".85"><stop stop-color="#12333F"/><stop offset=".58" stop-color="#0A1520"/><stop offset="1" stop-color="#070B13"/></radialGradient>
    <linearGradient id="edge"><stop stop-color="#F3C54E"/><stop offset=".38" stop-color="#59E8ED"/><stop offset=".78" stop-color="#59E8ED" stop-opacity=".12"/><stop offset="1" stop-color="#F65A9B"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="12" fill="#070B13"/>
  <rect x="1" y="1" width="1198" height="358" rx="11" fill="url(#atmosphere)" stroke="#263A4A"/>
  <rect x="1" y="1" width="1198" height="358" rx="11" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="11" fill="url(#scan)"/>
  <g clip-path="url(#panel-clip)"><g class="ambient-sweep"><path d="M-120 1H-24L120 359H24Z" fill="url(#sweep-light)"/><path d="M-24 1L120 359" stroke="#59E8ED" stroke-opacity=".12"/></g></g>
  <path d="M28 65V28H65M1135 28H1172V65M28 295V332H65M1135 332H1172V295" fill="none" stroke="#59E8ED" stroke-width="2"/>
  <path d="M48 63H1152" stroke="#29424F"/>
