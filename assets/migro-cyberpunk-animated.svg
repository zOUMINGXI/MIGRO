  <text x="68" y="42" fill="#A5B9C7" font-family="Menlo, Consolas, Liberation Mono, monospace" font-size="11" letter-spacing="2">MIGRO / MEMORY SYSTEMS</text>
  <text x="1152" y="42" text-anchor="end" fill="#66C8D1" font-family="Menlo, Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="1.5">PERFORMANCE // RESEARCH BUILD</text>
  <g fill="none" stroke="#59E8ED" stroke-opacity=".22">
    <path d="M945 97H1016L1050 131H1152M966 118H1005L1039 152H1107M922 257H993L1022 228H1152M990 278H1027L1054 251H1120"/>
    <path d="M1135 94V117M1142 94V117M1149 94V117"/>
