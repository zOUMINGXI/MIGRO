  <g clip-path="url(#divider-clip)"><g class="divider-packet"><path d="M48 310H208" stroke="url(#divider-light)" stroke-width="2"/></g></g>
  <text x="48" y="328" fill="#74919F" font-family="Menlo, Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="1.8">PERSISTENT MEMORY / MULTIPLE BACKBONES</text>
  <text x="1152" y="328" text-anchor="end" fill="#A4BDCA" font-family="Menlo, Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="1.8">CHANGE THE CARRIER. PRESERVE THE CONTINUITY.</text>
