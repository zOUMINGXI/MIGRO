  <g class="wordmark-magenta" transform="translate(394 138)" fill="#F65A9B" opacity=".16"><path d="M0 104V0H20L45 42L70 0H90V104H69V36L45 75L21 36V104Z"/>
    <path transform="translate(110)" d="M0 0H70V19H46V85H70V104H0V85H24V19H0Z"/>
