    <path id="pressure-stroke-M" d="M43.5 147.1 C45.1 125.9 44.1 95.9 47.2 69.4 C47.6 65.6 50.8 66.1 54.5 69.0 C70.6 83.4 88.7 103.3 106.3 120.3 C123.6 104.2 143.5 81.2 157.4 62.5 L166.7 70.7 C150.1 96.3 128.3 122.7 111.2 141.5 C108.9 144.5 106.4 145.8 103.4 143.8 C87.4 130.6 75.9 115.5 63.2 103.5 C62.1 117.1 63.6 131.5 61.4 145.9 C57.4 148 50.5 147.4 43.5 147.1 Z"/>
