  </g>
  <g fill="none" stroke-linecap="round" stroke-width="2.5">
    <path class="data-packet" pathLength="100" d="M945 97H1016L1050 131H1152" stroke="#75F9FF"/>
    <path class="data-packet packet-b" pathLength="100" d="M966 118H1005L1039 152H1107" stroke="#F3C54E"/>
