:root{color-scheme:dark;--bg:#0b100f;--panel:#111915;--line:#304038;--paper:#f0f1e5;--muted:#a4b2a8;--green:#c5f782;--amber:#f3c54e;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font:16px/1.45 var(--sans)}
button,select,input,textarea{font:inherit}button,a,select{touch-action:manipulation}button,a{transition:background .18s,color .18s,border-color .18s}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.frame{max-width:1344px;margin:auto;padding:0 clamp(18px,5vw,76px)}
header{border-bottom:1px solid var(--line)}nav{height:70px;display:flex;align-items:center;gap:22px}
.brand svg{display:block;width:120px;height:33px}.brand{display:inline-block}.nav-name,.eyebrow,.stamp,.legend,.index,.term,footer,.chip{font:11px/1.45 var(--mono);letter-spacing:.09em;text-transform:uppercase}.nav-name{padding-left:20px;border-left:1px solid var(--line);color:var(--muted)}
.repo{margin-left:auto;display:flex;gap:8px;align-items:center;border:1px solid #506350;border-radius:6px;padding:7px 12px;text-decoration:none;font-size:13px}.repo:hover,.quiet:hover{background:#29352c}.repo svg{width:17px;fill:none;stroke:var(--amber);stroke-width:1.5}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:26px;padding:29px 0 25px}.eyebrow,.legend,.term{color:var(--muted)}h1{font:500 clamp(52px,6.5vw,92px)/.96 Georgia,"Times New Roman",serif;letter-spacing:-.065em;margin:5px 0 0}h1 em{font-weight:400;color:var(--green)}.hero-desc{max-width:350px;font-size:17px;color:#c4cec4;margin:0 0 3px}

<script>
'use strict';
const $ = id => document.getElementById(id);
let trace = JSON.parse($('capture').textContent);
let stage = 0, question = 2, fresh = false;
const canRun = Boolean(document.querySelector('meta[name="migro-live"]'));
const buttons = [...document.querySelectorAll('.steps button')];
const probes = [...document.querySelectorAll('.questions button')];
const titles = ['Qwen takes the note.', 'Mistral opens the memory.', 'The plan changes.'];
const nextLabels = ['Hand off to Mistral →', 'Append the update →', 'Replay from Qwen ↺'];
const num = n => n.toLocaleString('en-US');
function render() {
  const item = trace.stages[stage], c = trace.case, row = item.answers[question];
  const hostName = item.host === 'A' ? 'Qwen 4B' : 'Mistral 7B';
  $('host').textContent = hostName;
  $('stats').textContent = num(item.bytes) + ' B  /  ' + item.observations + (item.observations === 1 ? ' note' : ' notes');
  $('runlabel').textContent = fresh ? 'Your model run' : 'Recorded model run';
  $('caseTitle').textContent = c.title;
  $('counter').textContent = ['SOURCE', 'TRANSFER', 'CONTINUATION'][stage];
  buttons.forEach((b,i) => {
    if (stage === i) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current');
  });
  probes.forEach((b,i) => b.setAttribute('aria-pressed', String(question === i)));
  $('stageTitle').textContent = titles[stage];
  $('note').textContent = stage === 1 ? num(item.bytes) + ' bytes transferred. The same note now belongs to Mistral’s session.' : '“' + (stage === 0 ? c.source : c.update) + '”';
  $('context').textContent = [
    c.speaker + ' · Source observation',
    'Mistral restored Qwen’s saved state. Try the same question on both hosts.',
    c.speaker + ' · Receiver observation. The original note is preserved.'
  ][stage];
  $('next').textContent = nextLabels[stage];
  $('q').textContent = c.questions[question];
  $('a').textContent = row.text || '[Empty model response]';
  $('prior').hidden = stage !== 2;
  $('prior').textContent = stage === 2 ? 'Before append · ' + trace.stages[1].answers[question].text : '';
  $('evidence').replaceChildren();
  for (const i of row.slots) {
    const p = document.createElement('p');
    p.textContent = ['Qwen','Mistral'][i] + ' · ' + [c.source,c.update][i];
    $('evidence').append(p);
  }
  $('caption').textContent = 'Native MIGRO · ' + trace.source_model + ' → ' + trace.target_model;
  document.body.dataset.stage = stage;
  draw();
}
function chooseStage(i) {stage = i; render();}
buttons.forEach((b,i) => b.onclick = () => chooseStage(i));
probes.forEach((b,i) => b.onclick = () => {question = i; render();});
$('next').onclick = () => chooseStage((stage+1)%3);

const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
let phase = 0, previous = 0, size = [0,0], frame = 0;
function draw() {
  const [w,h] = size;
  if (!w || !ctx) return;
  ctx.clearRect(0,0,w,h);
  const cx = w*.50, cy = h*.51;
  const radius = Math.min(w*.285,h*.285);
  const tilt = .78 + .08*Math.sin(phase*.24);
  const rot = -.37 + .09*Math.cos(phase*.16);
  const curves = [];
  for (let k=0;k<64;k++) {
    const v = k/64*Math.PI*2, points = []; let depth=0;
    for (let n=0;n<=160;n++) {
      const t = n/160*Math.PI*2;
      const twist = v+2*t+phase*.42, tube = .39+.09*Math.sin(t*3+phase*.28);
      const radial = .96 + tube*Math.cos(twist) + .12*Math.sin(3*t-phase*.18);
      const x = radial*Math.cos(t), y = radial*Math.sin(t);
      const z = tube*Math.sin(twist) + .21*Math.sin(2*t+phase*.18);
      const yy = y*Math.cos(tilt) - z*Math.sin(tilt);
      const zz = y*Math.sin(tilt) + z*Math.cos(tilt);
      const zoom = radius*(1+.085*zz);
      points.push([cx+(x*Math.cos(rot)-yy*Math.sin(rot))*zoom,
                   cy+(x*Math.sin(rot)+yy*Math.cos(rot))*zoom]);
      depth += zz;
    }
    curves.push({points, depth, k});
  }
  curves.sort((a,b) => a.depth-b.depth);
  curves.forEach(({points,k}) => {
    const light = .5+.5*Math.cos(k/64*Math.PI*2-phase*.21);
    ctx.strokeStyle = stage === 0 ? 'hsla('+ (79+light*32) +',80%,'+(39+light*35)+'%,'+(.26+light*.65)+')' :
      'hsla('+ (stage === 1 ? 146+light*18 : 70+light*50) +',72%,'+(42+light*33)+'%,'+(.28+light*.66)+')';
    ctx.lineWidth = .73+light*.57;
    ctx.beginPath();points.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));ctx.stroke();
  });
  // A ruler makes the evolving wire illustration read as an instrument panel.
  ctx.fillStyle='#8ab69a70';
  for(let i=0;i<28;i++)ctx.fillRect(12, h*.23+i*h*.019, i%4===0?6:3, 1);
  ctx.strokeStyle='#a5be9660';ctx.lineWidth=1;
  for(const [x,y] of [[w*.18,h*.3],[w*.81,h*.74]]) {
    ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+4,y);ctx.moveTo(x,y-4);ctx.lineTo(x,y+4);ctx.stroke();
  }
}
function tick(now) {
  if (now-previous>=40) {phase+=Math.min(70,now-previous)/1000;previous=now;draw();}
  if(!paused && !document.hidden)frame=requestAnimationFrame(tick);
}
function setMotion() {
  cancelAnimationFrame(frame); previous=performance.now();
  $('motion').textContent=paused?'Play motion':'Pause motion';
  $('motion').setAttribute('aria-pressed',String(paused));
  if(!paused && !document.hidden)frame=requestAnimationFrame(tick);
}
new ResizeObserver(() => {
  const b=canvas.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1);
  size=[b.width,b.height];canvas.width=Math.round(b.width*d);canvas.height=Math.round(b.height*d);
  if(ctx)ctx.setTransform(d,0,0,d,0,0);draw();
}).observe(canvas);
$('motion').onclick=()=>{paused=!paused;setMotion();};
document.addEventListener('visibilitychange',setMotion);

const editor=$('editor'), form=$('caseForm');
for(let i=0;i<3;i++){
  const l=document.createElement('label'),q=document.createElement('input');
  l.htmlFor='customQ'+i; l.textContent=['Old fact question','Latest plan question','Combined question'][i];
  q.id=l.htmlFor; q.required=true;q.maxLength=360;
  $('qFields').append(l,q);
}
$('remix').onclick=()=>{
  const c=trace.case;
  $('sNote').value=c.source;$('tNote').value=c.update;
  c.questions.forEach((q,i)=>$('customQ'+i).value=q);
  $('editHelp').textContent=canRun?'Write two observations and ask your own questions. Both hosts will run again.':'Edit the observations and questions, then download a case to run with the MIGRO models.';
  $('runHelp').textContent=canRun?'The first run includes loading both models.':'From the repository: python demo/run.py --case session.json --output trace.json';
  $('saveCase').textContent=canRun?'Generate with MIGRO':'Download session.json';
  $('status').textContent='';editor.showModal();
};
$('close').onclick=()=>editor.close();
form.onsubmit=async ev=>{
  ev.preventDefault();
  const c={title:'Your listening session',speaker:trace.case.speaker,source:$('sNote').value.trim(),
    update:$('tNote').value.trim(),questions:[0,1,2].map(i=>$('customQ'+i).value.trim())};
  if(!c.source || !c.update || c.questions.some(q=>!q)){ $('status').textContent='Please fill in both notes and all three questions.';return;}
  if(!canRun){
    const url=URL.createObjectURL(new Blob([JSON.stringify(c,null,2)],{type:'application/json'}));
    const a=document.createElement('a');a.download='session.json';a.href=url;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='Case downloaded.';return;
  }
  $('saveCase').disabled=true;$('remix').disabled=true;
  $('status').textContent='Running Qwen and Mistral on your observations…';
  try {
    const res=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});
    const data=await res.json();
    if(!res.ok)throw Error(data.error||'Model run failed.');
    trace=data;stage=0;question=2;fresh=true;render();editor.close();
  }catch(e){$('status').textContent=e.message;}finally{$('saveCase').disabled=false;$('remix').disabled=false;}
};
render();setMotion();
</script></body></html>
